name: Build UTM HV for iOS 16.3

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build the full IPA or only prebuild the LLVM cache
        required: true
        type: choice
        options:
          - full
          - llvm-cache
        default: full
      force_rebuild:
        description: Force rebuild the iOS sysroot (full build only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep builds from different branches independent. Without the ref suffix,
  # dispatching this compatibility branch would cancel the guard build that
  # is already running because cancel-in-progress is enabled.
  group: build-utm-hv-ios-arm64-${{ github.ref }}-${{ inputs.build_target }}
  cancel-in-progress: true

env:
  BUILD_XCODE_PATH: /Applications/Xcode_26.0.1.app
  IOS_PLATFORM: ios
  IOS_ARCH: arm64
  SYSROOT_LOWER: sysroot-ios-arm64
  SYSROOT_UPPER: sysroot-iOS-arm64
  RETRY_ATTEMPTS: "8"
  RETRY_DELAY: "20"

jobs:
  build-ios-hv:
    name: Build iOS arm64 dependencies / HV IPA
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout UTM and all required submodules
      # ---------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ---------------------------------------------------------------
      # 2. Select Xcode
      #
      # Only iphoneos is used. No visionOS runtime or simulator runtime
      # is required for this workflow.
      # ---------------------------------------------------------------
      - name: Setup Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "${BUILD_XCODE_PATH}" ]; then
            echo "Xcode not found: ${BUILD_XCODE_PATH}"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "${BUILD_XCODE_PATH}"

          echo "Selected Xcode:"
          xcodebuild -version

          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

          echo "Available SDKs:"
          xcodebuild -showsdks

      # ---------------------------------------------------------------
      # 3. Make Homebrew build tools visible
      # ---------------------------------------------------------------
      - name: Setup build paths
        shell: bash
        run: |
          echo "/usr/local/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/gettext/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/gettext/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------
      # 4. Restore only the iOS arm64 sysroot
      #
      # Both spellings are listed because macOS normally uses a
      # case-insensitive filesystem while the script internally calls the
      # directory sysroot-iOS-arm64.
      # ---------------------------------------------------------------
      - name: Restore iOS arm64 sysroot cache
        id: sysroot-cache
        if: inputs.build_target == 'full'
        uses: actions/cache@v4
        with:
          path: |
            sysroot-ios-arm64
            sysroot-iOS-arm64
          key: >-
            utm-ios-arm64-xcode-26.0.1-v3-
            ${{ hashFiles('scripts/build_dependencies.sh', 'patches/**') }}

      # ---------------------------------------------------------------
      # 5. Restore LLVM independently from the rest of the sysroot
      #
      # LLVM is stable across most QEMU, virglrenderer, Mesa and DXMT
      # patches. Its focused key avoids paying the ~23 minute LLVM build
      # cost whenever another dependency invalidates the full sysroot.
      # ---------------------------------------------------------------
      - name: Restore iOS arm64 LLVM cache
        id: llvm-cache
        if: >-
          inputs.build_target == 'llvm-cache' ||
          steps.sysroot-cache.outputs.cache-hit != 'true' ||
          inputs.force_rebuild == true
        uses: actions/cache@v4
        with:
          path: .cache/llvm-ios-arm64
          key: >-
            utm-llvm15-ios-arm64-xcode-26.0.1-v1-
            ${{ hashFiles('scripts/llvm_cache_config.sh', 'patches/llvm-project-15.0.7.src.patch') }}

      # ---------------------------------------------------------------
      # 6. Force rebuild when requested
      # ---------------------------------------------------------------
      - name: Remove restored sysroot for forced rebuild
        if: inputs.build_target == 'full' && inputs.force_rebuild == true
        shell: bash
        run: |
          rm -rf \
            "${SYSROOT_LOWER:?}" \
            "${SYSROOT_UPPER:?}"

      # ---------------------------------------------------------------
      # 7. Install host-side dependencies
      #
      # This includes the explicitly required SPIRV-Tools package.
      # ---------------------------------------------------------------
      - name: Install build requirements
        if: >-
          inputs.build_target == 'llvm-cache' ||
          steps.sysroot-cache.outputs.cache-hit != 'true' ||
          inputs.force_rebuild == true
        shell: bash
        run: |
          set -euo pipefail

          brew uninstall cmake || true

          brew install \
            bison \
            pkg-config \
            gettext \
            glib-utils \
            libgpg-error \
            nasm \
            make \
            meson \
            cmake

          brew install \
            llvm \
            spirv-llvm-translator \
            libclc \
            spirv-tools \
            libxcb \
            libxrandr

          python3 -m pip install \
            --break-system-packages \
            --user \
            six \
            pyparsing \
            pyyaml \
            setuptools \
            distlib \
            mako

          gem install --user-install xcpretty

          rm -f /usr/local/lib/pkgconfig/*.pc || true

          echo "Dependency versions:"
          meson --version
          cmake --version
          /opt/homebrew/opt/llvm/bin/llvm-config --version
          pkg-config --modversion SPIRV-Tools
          pkg-config --modversion llvmspirvlib || true

      # ---------------------------------------------------------------
      # 8. Build only iOS arm64
      #
      # No simulator, TCI, macOS or visionOS sysroots are built.
      # ---------------------------------------------------------------
      - name: Build iOS arm64 sysroot
        if: >-
          inputs.build_target == 'full' &&
          (steps.sysroot-cache.outputs.cache-hit != 'true' || inputs.force_rebuild == true)
        shell: bash
        env:
          NCPU: "0"
          LLVM_CACHE_DIR: ${{ github.workspace }}/.cache/llvm-ios-arm64
        run: |
          set -euo pipefail

          ./scripts/build_dependencies.sh \
            -p ios \
            -a arm64

      - name: Prebuild iOS arm64 LLVM cache
        if: inputs.build_target == 'llvm-cache'
        shell: bash
        env:
          NCPU: "0"
          LLVM_CACHE_DIR: ${{ github.workspace }}/.cache/llvm-ios-arm64
        run: |
          set -euo pipefail

          ./scripts/build_dependencies.sh \
            --llvm-only \
            -p ios \
            -a arm64

      # ---------------------------------------------------------------
      # 9. Verify that the required sysroot exists
      # ---------------------------------------------------------------
      - name: Verify iOS sysroot
        if: inputs.build_target == 'full'
        shell: bash
        run: |
          set -euo pipefail

          echo "Available sysroots:"
          find . -maxdepth 1 -type d -iname 'sysroot*' -print

          if [ -d "${SYSROOT_UPPER}" ]; then
            SYSROOT_PATH="${SYSROOT_UPPER}"
          elif [ -d "${SYSROOT_LOWER}" ]; then
            SYSROOT_PATH="${SYSROOT_LOWER}"
          else
            echo "iOS arm64 sysroot was not found."
            exit 1
          fi

          echo "Using sysroot: ${SYSROOT_PATH}"

          test -d "${SYSROOT_PATH}/lib"
          test -d "${SYSROOT_PATH}/include"
          test -d "${SYSROOT_PATH}/Frameworks"

          echo "Sysroot size:"
          du -sh "${SYSROOT_PATH}"

      # ---------------------------------------------------------------
      # 10. Compile only the full iOS scheme
      #
      # This is the full UTM build used for HV packaging.
      # It is not UTM SE and does not use TCI.
      # ---------------------------------------------------------------
      - name: Build UTM iOS archive
        if: inputs.build_target == 'full'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf UTM.xcarchive

          ./scripts/build_utm.sh \
            -k iphoneos \
            -s iOS \
            -a arm64 \
            -o UTM

          test -d UTM.xcarchive
          test -d UTM.xcarchive/Products/Applications/UTM.app

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.utmapp.UTMdxquick" \
            UTM.xcarchive/Products/Applications/UTM.app/Info.plist

          echo "Archive created:"
          du -sh UTM.xcarchive

      # ---------------------------------------------------------------
      # 11. Install only the packager required for fake signing
      # ---------------------------------------------------------------
      - name: Install HV packaging requirement
        if: inputs.build_target == 'full'
        shell: bash
        run: |
          brew install ldid
          ldid -h >/dev/null 2>&1 || true

      # ---------------------------------------------------------------
      # 12. Package only ipa-hv
      #
      # package.sh adds the private Hypervisor entitlement and removes
      # the dynamic-codesigning entitlement used by the normal JIT IPA.
      # ---------------------------------------------------------------
      - name: Package UTM-HV IPA
        if: inputs.build_target == 'full'
        shell: bash
        run: |
          set -euo pipefail

          rm -f UTM.ipa UTM-HV.ipa

          ./scripts/package.sh \
            ipa-hv \
            UTM.xcarchive \
            .

          test -f UTM.ipa
          mv UTM.ipa UTM-HV.ipa
          test -f UTM-HV.ipa

          echo "Final IPA:"
          ls -lh UTM-HV.ipa

      # ---------------------------------------------------------------
      # 13. Inspect packaged application and entitlements
      # ---------------------------------------------------------------
      - name: Verify UTM-HV IPA
        if: inputs.build_target == 'full'
        shell: bash
        run: |
          set -euo pipefail

          VERIFY_DIR="$RUNNER_TEMP/verify-utm-hv"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          unzip -q UTM-HV.ipa -d "$VERIFY_DIR"

          APP_PATH="$VERIFY_DIR/Payload/UTM.app"
          EXECUTABLE="$APP_PATH/UTM"

          test -d "$APP_PATH"
          test -f "$EXECUTABLE"

          echo "Application information:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$APP_PATH/Info.plist")" = "com.utmapp.UTMdxquick"

          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$APP_PATH/Info.plist"

          echo "Architectures:"
          lipo -info "$EXECUTABLE"

          echo "Entitlements:"
          ldid -e "$EXECUTABLE" | tee "$RUNNER_TEMP/utm-hv-entitlements.plist"

          grep -q "com.apple.private.hypervisor" \
            "$RUNNER_TEMP/utm-hv-entitlements.plist"

          grep -q "com.apple.vm.device-access" \
            "$RUNNER_TEMP/utm-hv-entitlements.plist"

          if grep -q "dynamic-codesigning" \
            "$RUNNER_TEMP/utm-hv-entitlements.plist"; then
            echo "Unexpected dynamic-codesigning entitlement in HV package."
            exit 1
          fi

          echo "UTM-HV verification completed successfully."

      # ---------------------------------------------------------------
      # 14. Upload only the final HV IPA
      # ---------------------------------------------------------------
      - name: Upload UTM-HV IPA
        if: inputs.build_target == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: UTM-HV-Windows-Quick-Settings-AGX-iPadOS-16.3-arm64
          path: UTM-HV.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
